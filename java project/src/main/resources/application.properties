spring.application.name=room-allocation-system

# MySQL Configuration (defaults match docker-compose.yml; override with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/room_allocation_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Akshay@6235}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# Quote reserved words in generated DDL ("row_number" in the seat table would otherwise fail on MySQL)
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.show-sql=true

# Initial administrator (development defaults - override in production!)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin}

# Sessions expire after 30 minutes of inactivity
server.servlet.session.timeout=30m

# Server Port
server.port=8080

# Allow larger PDF/Excel uploads for the import feature
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.announcement-storage-dir=${ANNOUNCEMENT_STORAGE_DIR:./data/announcement-attachments}

# Include the error message in JSON error responses
server.error.include-message=always

# ---- Native Web Push (browser push notifications, self-hosted VAPID) ----
# Generate a key pair with: npm run generate:vapid (in the notification tooling),
# or any Web Push VAPID key generator. The PUBLIC key below is handed to the
# browser for pushManager.subscribe() and is not a secret; the PRIVATE key
# signs requests towards the browser's push service and must stay server-side.
# When both are empty the server generates an ephemeral pair at startup (local
# development only) and logs a warning; production requires them explicitly.
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
# Contact for the push service (mailto: or https: URL) per RFC 8292.
app.push.vapid-subject=${VAPID_SUBJECT:mailto:admin@localhost}
